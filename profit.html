<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://goldwave-notice.github.io/profit.html">
  <meta property="og:title" content="GOLD WAVE - 수익 현황">
  <meta property="og:description" content="일일 수익 리포트">
  <meta property="og:image" content="https://github.com/goldwave-notice/-/blob/main/profit-main.png?raw=true">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <title>GOLD WAVE - 수익 현황</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    html, body { margin: 0; padding: 0; background-color: #0b0d11; font-family: 'Pretendard', sans-serif; color: #e0e0e0; overflow-x: hidden; width: 100%; }
    body { display: flex; flex-direction: column; align-items: center; padding-bottom: 120px; }
    .header-sticky { position: fixed; top: 0; left: 0; width: 100%; background: rgba(26,29,35,0.95); border-bottom: 1px solid rgba(191,149,63,0.3); z-index: 1000; padding: 15px 0; text-align: center; backdrop-filter: blur(10px); }
    .header-title { font-size: 16px; font-weight: 800; color: #bf953f; letter-spacing: 1px; }
    .back-nav { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); text-decoration: none; color: #bf953f; font-size: 24px; }
    .container { width: 92%; max-width: 1000px; margin-top: 100px; display: flex; flex-direction: column; align-items: center; }
    .header-box-centered { text-align: center; margin-bottom: 50px; width: 100%; }
    .brand-logo { width: 60px; height: auto; margin-bottom: 15px; filter: drop-shadow(0 0 8px rgba(191,149,63,0.5)); }
    .header-text h1 { color: #bf953f; font-size: 28px; margin: 0; font-weight: 800; letter-spacing: -1px; }
    .header-text p { color: #aaa; font-size: 16px; margin-top: 10px; font-weight: 700; }
    .profit-section { width: 100%; margin-bottom: 40px; background: rgba(255,255,255,0.02); padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); box-sizing: border-box; }
    .date-badge { display: inline-block; background: linear-gradient(135deg,#bf953f,#fcf6ba); color: #000; padding: 6px 16px; border-radius: 40px; font-weight: 800; font-size: 14px; margin-bottom: 20px; }
    .magnify-container { position: relative; overflow: hidden; border-radius: 12px; cursor: zoom-in; background-color: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 100%; }
    .profit-img { width: 100%; height: auto; display: block; transition: transform 0.15s ease-out; transform-origin: center; }
    .loading-text { text-align: center; padding: 60px; color: #555; font-size: 16px; }
    .holiday-notice { width: 100%; text-align: center; padding: 30px; background: rgba(191,149,63,0.05); border: 1px dashed rgba(191,149,63,0.4); border-radius: 20px; margin-bottom: 40px; box-sizing: border-box; }
    .holiday-notice p { color: #fcf6ba; font-size: 15px; margin: 0; line-height: 1.6; }
    @media (min-width: 1024px) { .header-text h1 { font-size: 36px; } .header-text p { font-size: 18px; } }
  </style>
</head>
<body>
  <div class="header-sticky">
    <a href="dashboard-new.html" class="back-nav"><i class="fa-solid fa-arrow-left"></i></a>
    <div class="header-title">GOLD WAVE 수익현황</div>
  </div>

  <div class="container">
    <div class="header-box-centered">
      <img src="https://i.imgur.com/9VUt3sN.png" alt="Logo" class="brand-logo">
      <div class="header-text">
        <h1>GOLD WAVE PROFIT REPORT</h1>
        <p>실시간 수익 현황 및 공지</p>
      </div>
    </div>
    <div id="profit-list"><div class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> 불러오는 중...</div></div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyAGCPGRXXNUiiT-mK1y_xLKvCJpz5sHY8Y",
      authDomain: "inc-management-161be.firebaseapp.com",
      projectId: "inc-management-161be",
      storageBucket: "inc-management-161be.firebasestorage.app",
      messagingSenderId: "1098276603524",
      appId: "1:1098276603524:web:0ae75899d5b9a2a3c524d1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const dayKo = {'MON':'(MON)','TUE':'(TUE)','WED':'(WED)','THU':'(THU)','FRI':'(FRI)','SAT':'(SAT)','SUN':'(SUN)'};

    async function loadProfitImages() {
      const snap = await getDocs(collection(db, 'profitImages'));
      const data = snap.docs.map(d => d.data());
      const sorted = data.sort((a,b) => b.docId.localeCompare(a.docId));

      const container = document.getElementById('profit-list');

      if (!sorted.length) {
        container.innerHTML = '<div class="loading-text">등록된 수익현황이 없습니다</div>';
        return;
      }

      let html = '';
      sorted.forEach((r, i) => {
        const id = 'zoom-' + r.docId;
        html += `
          <div class="profit-section">
            <div class="date-badge">${r.date} ${dayKo[r.dayOfWeek]||''}</div>
            <div class="magnify-container" id="${id}">
              <img src="${r.imageUrl}" alt="${r.date} 수익현황" class="profit-img">
            </div>
          </div>`;
      });

      container.innerHTML = html;

      // 줌 기능 연결
      sorted.forEach(r => {
        enableZoom('zoom-' + r.docId);
      });
    }

    function enableZoom(containerId) {
      const container = document.getElementById(containerId);
      if (!container) return;
      const img = container.querySelector('.profit-img');
      container.addEventListener('mousemove', (e) => {
        const { left, top, width, height } = container.getBoundingClientRect();
        const x = ((e.clientX - left) / width) * 100;
        const y = ((e.clientY - top) / height) * 100;
        img.style.transformOrigin = `${x}% ${y}%`;
        img.style.transform = 'scale(1.8)';
      });
      container.addEventListener('mouseleave', () => {
        img.style.transformOrigin = 'center';
        img.style.transform = 'scale(1)';
      });
    }

    loadProfitImages();
  </script>
</body>
</html>
